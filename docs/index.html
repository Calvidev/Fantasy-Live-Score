<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Live Score</title>
<style>
  :root { color-scheme: light dark; --fondo:#f6f6f7; --tarjeta:#fff; --texto:#16161a; --tenue:#6b6b73; --acento:#2f9e6e; --borde:#e3e3e7; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#0e0e10; --tarjeta:#1c1c1e; --texto:#f4f4f6; --tenue:#9a9aa2; --acento:#5fd6a0; --borde:#2a2a2b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--fondo); color:var(--texto);
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .tarjeta { width:100%; max-width:440px; background:var(--tarjeta); border:1px solid var(--borde);
             border-radius:18px; padding:28px 24px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--tenue); font-size:14px; margin:0 0 20px; }
  .ok { color:var(--acento); font-weight:600; }
  ul { margin:0; padding-left:18px; font-size:14px; }
  li { margin-bottom:6px; }
  a { color:var(--acento); }
</style>
</head>
<body>
  <div class="tarjeta">
    <h1>Fantasy Live Score</h1>
    <p>Tu marcador de fantasy en la pantalla de bloqueo del iPhone.</p>
    <p class="ok">✓ GitHub Pages está funcionando.</p>
    <ul>
      <li><a href="yahoo.html">yahoo.html</a> — la vuelta del login de Yahoo</li>
      <li><a href="https://github.com/Calvidev/Fantasy-Live-Score">Código en GitHub</a></li>
    </ul>
  </div>
</body>
</html>
