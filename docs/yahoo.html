<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volviendo a la app…</title>
<style>
  :root {
    color-scheme: light dark;
    --fondo: #f6f6f7;
    --tarjeta: #ffffff;
    --texto: #16161a;
    --tenue: #6b6b73;
    --acento: #2f9e6e;
    --borde: #e3e3e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0e0e10;
      --tarjeta: #1c1c1e;
      --texto: #f4f4f6;
      --tenue: #9a9aa2;
      --acento: #5fd6a0;
      --borde: #2a2a2b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .tarjeta {
    width: 100%;
    max-width: 420px;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 18px;
    padding: 28px 24px;
    text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--tenue); margin: 0 0 18px; font-size: 14px; }
  .codigo {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
    word-break: break-all;
    background: var(--fondo);
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    user-select: all;
  }
  button, a.boton {
    display: block;
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    background: var(--acento);
    color: #04160e;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 10px;
  }
  a.secundario {
    background: transparent;
    color: var(--acento);
    border: 1px solid var(--borde);
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="tarjeta">
  <h1 id="titulo">Volviendo a la app…</h1>
  <p id="ayuda">Si no se abre sola, copia el código y pégalo en Ajustes → Yahoo.</p>

  <div id="bloqueCodigo" hidden>
    <div class="codigo" id="codigo"></div>
    <button id="copiar" type="button">Copiar código</button>
    <a class="boton secundario" id="abrir" href="#">Abrir la app</a>
  </div>

  <div id="bloqueError" hidden>
    <p id="detalleError"></p>
  </div>
</div>

<script>
  // Yahoo exige una dirección de vuelta https, así que vuelve aquí. Esta
  // página no guarda nada ni habla con ningún servidor: lee el código de la
  // barra de direcciones y se lo pasa a la app por su propio esquema.
  var parametros = new URLSearchParams(location.search);
  var codigo = parametros.get("code");
  var fallo = parametros.get("error_description") || parametros.get("error");

  var titulo = document.getElementById("titulo");
  var ayuda = document.getElementById("ayuda");

  if (codigo) {
    var destino = "sleeperscore://yahoo?code=" + encodeURIComponent(codigo);
    document.getElementById("codigo").textContent = codigo;
    document.getElementById("abrir").href = destino;
    document.getElementById("bloqueCodigo").hidden = false;

    document.getElementById("copiar").addEventListener("click", function () {
      var boton = this;
      navigator.clipboard.writeText(codigo).then(function () {
        boton.textContent = "Copiado";
        setTimeout(function () { boton.textContent = "Copiar código"; }, 1500);
      }).catch(function () {
        boton.textContent = "Selecciónalo y cópialo a mano";
      });
    });

    // El salto a la app. Si el sistema lo bloquea, arriba queda el código.
    location.replace(destino);
    setTimeout(function () {
      titulo.textContent = "Ya casi";
      ayuda.textContent = "Toca «Abrir la app», o copia el código y pégalo en Ajustes → Yahoo.";
    }, 1200);
  } else {
    titulo.textContent = fallo ? "Yahoo no autorizó" : "Aquí no hay ningún código";
    ayuda.textContent = fallo
      ? "Vuelve a intentarlo desde la app."
      : "A esta página se llega al autorizar desde la app, no directamente.";
    if (fallo) {
      document.getElementById("detalleError").textContent = fallo;
      document.getElementById("bloqueError").hidden = false;
    }
  }
</script>
</body>
</html>
